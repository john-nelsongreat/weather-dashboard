<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">☁️</div>
          <div>
            <p class="eyebrow">Live forecast</p>
            <h1>Skyline Weather</h1>
          </div>
        </div>

        <form id="searchForm" class="search-form" autocomplete="off">
          <label class="sr-only" for="cityInput">Search city</label>
          <input
            id="cityInput"
            type="text"
            placeholder="Search city or town..."
            aria-label="Search city"
          />
          <button type="submit">Search</button>
        </form>

        <button id="locationBtn" class="location-btn" type="button">
          Use my location
        </button>
      </header>

      <main id="appContent" class="dashboard">
        <section class="current-card panel hero-card">
          <div class="hero-copy">
            <p class="eyebrow subtle-eyebrow">Current conditions</p>
            <div class="current-header">
              <div>
                <p id="locationName" class="location-name">Loading...</p>
                <p id="currentDate" class="current-date"></p>
              </div>
              <div id="weatherIcon" class="weather-icon" aria-label="Weather icon">⏳</div>
            </div>

            <div class="temp-row">
              <div id="currentTemp" class="current-temp">--°</div>
              <div class="meta">
                <p id="conditionText" class="condition-text">Loading...</p>
                <p id="feelsLike" class="subtle">Feels like --°</p>
              </div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="stat">
              <span>Wind</span>
              <strong id="wind">-- km/h</strong>
            </div>
            <div class="stat">
              <span>Pressure</span>
              <strong id="pressure">-- hPa</strong>
            </div>
            <div class="stat">
              <span>Clouds</span>
              <strong id="clouds">--%</strong>
            </div>
          </div>
        </section>

        <section class="forecast panel">
          <div class="section-title">
            <h2>7-day forecast</h2>
          </div>
          <div id="forecastList" class="forecast-list"></div>
        </section>

        <section class="hourly panel">
          <div class="section-title">
            <h2>Hourly outlook</h2>
          </div>
          <div id="hourlyList" class="hourly-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
