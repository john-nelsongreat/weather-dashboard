<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">☁️</div>
          <div>
            <p class="eyebrow">Live forecast</p>
            <h1>Skyline Weather</h1>
          </div>
        </div>

        <form id="searchForm" class="search-form" autocomplete="off">
          <label class="sr-only" for="cityInput">Search city</label>
          <input
            id="cityInput"
            type="text"
            placeholder="Search city or town..."
            aria-label="Search city"
          />
          <button type="submit">Search</button>
        </form>

        <button id="locationBtn" class="location-btn" type="button">
          Use my location
        </button>
      </header>

      <main id="appContent" class="dashboard">
        <section class="current-card panel hero-card">
          <div class="hero-copy">
            <p class="eyebrow subtle-eyebrow">Current conditions</p>
            <div class="current-header">
              <div>
                <p id="locationName" class="location-name">Loading...</p>
                <p id="currentDate" class="current-date"></p>
              </div>
              <div id="weatherIcon" class="weather-icon" aria-label="Weather icon">⏳</div>
            </div>

            <div class="temp-row">
              <div id="currentTemp" class="current-temp">--°</div>
              <div class="meta">
                <p id="conditionText" class="condition-text">Loading...</p>
                <p id="feelsLike" class="subtle">Feels like --°</p>
              </div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="stat">
              <span>Wind</span>
              <strong id="wind">-- km/h</strong>
            </div>
            <div class="stat">
              <span>Pressure</span>
              <strong id="pressure">-- hPa</strong>
            </div>
            <div class="stat">
              <span>Clouds</span>
              <strong id="clouds">--%</strong>
            </div>
          </div>

          <div class="location-controls" aria-label="Location selectors">
            <div class="selector-field">
              <label for="countrySelect">Country</label>
              <select id="countrySelect">
                <option value="">Select country</option>
              </select>
            </div>
            <div class="selector-field">
              <label for="stateSelect">State</label>
              <select id="stateSelect">
                <option value="">Select state</option>
              </select>
            </div>
            <div class="selector-field">
              <label for="lgaSelect">LGA</label>
              <select id="lgaSelect">
                <option value="">Select LGA</option>
              </select>
            </div>
          </div>

          <div class="mascot-stage" aria-label="Weather mascot stage">
            <div class="mascot-band">
              <svg id="mascot" class="mascot" viewBox="0 0 260 180" role="img" aria-label="Weather mascot">
                <g id="cloud-layer" class="cloud-layer">
                  <ellipse cx="128" cy="118" rx="88" ry="26" fill="#e0f2fe" opacity="0.85" />
                  <ellipse cx="75" cy="110" rx="40" ry="18" fill="#f0f9ff" opacity="0.9" />
                  <ellipse cx="180" cy="108" rx="42" ry="18" fill="#f0f9ff" opacity="0.9" />
                </g>

                <g id="body-layer" class="body-layer">
                  <circle cx="128" cy="92" r="38" fill="#f7c68d" />
                  <path d="M102 103c8 18 27 31 48 31 24 0 41-16 49-34l9 17c-11 33-39 52-75 52-29 0-51-15-65-48l34-18z" fill="#7dd3fc" />
                  <path d="M109 124c15 8 31 12 47 12 16 0 31-4 42-11l-6 25c-8 12-21 19-35 19-19 0-38-10-50-30l2-15z" fill="#38bdf8" opacity="0.7" />
                </g>

                <g id="head-layer" class="head-layer">
                  <circle cx="128" cy="58" r="34" fill="#f7c68d" />
                  <path d="M94 55c5-23 28-35 53-31 19 3 31 17 33 33-11-11-25-15-40-15-16 0-30 6-46 13z" fill="#0f172a" opacity="0.16" />
                </g>

                <g id="face-layer" class="face-layer">
                  <circle cx="116" cy="58" r="3.5" fill="#0f172a" />
                  <circle cx="141" cy="58" r="3.5" fill="#0f172a" />
                  <path d="M120 69c5 5 15 5 20 0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
                  <path d="M112 47c5-4 13-7 18-7 7 0 15 3 20 9" stroke="#d97706" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55" />
                </g>

                <g id="arm-layer" class="arm-layer">
                  <path d="M88 92l-22 16" stroke="#f7c68d" stroke-width="9" stroke-linecap="round" />
                  <path d="M169 93l22 16" stroke="#f7c68d" stroke-width="9" stroke-linecap="round" />
                </g>

                <g id="leg-layer" class="leg-layer">
                  <path d="M118 126l-10 18" stroke="#f7c68d" stroke-width="8" stroke-linecap="round" />
                  <path d="M140 126l10 18" stroke="#f7c68d" stroke-width="8" stroke-linecap="round" />
                </g>
              </svg>
            </div>
          </div>
        </section>

        <section class="forecast panel">
          <div class="section-title">
            <h2>7-day forecast</h2>
          </div>
          <div id="forecastList" class="forecast-list"></div>
        </section>

        <section class="hourly panel">
          <div class="section-title">
            <h2>Hourly outlook</h2>
          </div>
          <div id="hourlyList" class="hourly-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
